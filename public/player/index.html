    <title>BrainBurst</title>
    <meta name="description" content="Real-time multiplayer trivia player buzzer and interactive controller">
    <meta property="og:title" content="BrainBurst">
    <meta property="og:description" content="Real-time multiplayer trivia player buzzer and interactive controller">
    <link rel="stylesheet" href="style.css">

<body>
    <!-- Player Top Bar -->
    <div class="player-topbar">
        <div class="topbar-left">
            <span id="player-reconnect-badge" class="player-badge hidden">Restoring Session...</span>
            <span id="player-question-badge" class="player-badge hidden">Q 1/5</span>
        </div>
        <button id="player-sound-btn" class="player-sound-toggle" title="Toggle Sound">
            <span id="player-sound-icon" class="icon-wrap">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </span>
        </button>
    </div>

    <!-- Notification / Kicked Banner -->
    <div id="player-notification" class="player-notification hidden">
        <span id="notification-text">Notification message</span>
    </div>

    <div id="join-section" class="card">
        <h1 class="logo">BrainBurst</h1>

            <input type="number" id="pin-input" placeholder="Game PIN" class="fat-input" disabled>
            <input type="text" id="name-input" placeholder="Nickname" class="fat-input" disabled>
        </div>

    <!-- 2. Waiting / Results Screen -->
    <div id="waiting-section" class="waiting-screen hidden">
        <div id="waiting-avatar" class="waiting-player-avatar"></div>
        <div id="waiting-icon" class="status-icon">
            <svg viewBox="0 0 64 64" width="60" height="60" fill="none"><circle cx="32" cy="32" r="28" fill="#FFFFFF" fill-opacity="0.25"/><path d="M20 33L28 41L44 23" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 id="waiting-title">You're in!</h2>
        <p id="waiting-subtitle">Look at the big screen.</p>
        <div id="streak-badge" class="streak-badge hidden">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" class="svg-flame"><path d="M12 2C10 6 7 9 7 13C7 16.5 9.5 19 12 19C14.5 19 17 16.5 17 13C17 10 15 7 12 2Z" fill="#F97316"/><path d="M12 9C10.5 11.5 9.5 13 9.5 15C9.5 16.5 10.5 18 12 18C13.5 18 14.5 16.5 14.5 15C14.5 13.5 13.5 12 12 9Z" fill="#FDE047"/></svg>
            <span id="streak-count">0</span> Streak
        </div>
        <h3 id="waiting-score" style="margin-top: 1.25rem; font-size: 1.8rem;"></h3>
        <button id="leave-game-btn" class="leave-btn">Leave Game</button>
    </div>

    <!-- 3. Game Controller Screen -->
    <div id="controller-section" class="controller-screen hidden">
        <div class="controller-grid">
            <button class="ctrl-btn color-red" data-index="0">
                <span class="ctrl-shape">▲</span>
                <span class="ctrl-text" id="ctrl-text-0"></span>
            </button>
            <button class="ctrl-btn color-blue" data-index="1">
                <span class="ctrl-shape">♦</span>
                <span class="ctrl-text" id="ctrl-text-1"></span>
            </button>
            <button class="ctrl-btn color-yellow" data-index="2">
                <span class="ctrl-shape">⬤</span>
                <span class="ctrl-text" id="ctrl-text-2"></span>
            </button>
            <button class="ctrl-btn color-green" data-index="3">
                <span class="ctrl-shape">■</span>
                <span class="ctrl-text" id="ctrl-text-3"></span>
            </button>
        </div>
    </div>

    <!-- 4. End-Game Celebration & Player Report Card Screen -->
    <div id="gameover-section" class="gameover-screen hidden">
        <div class="report-card">
            <div id="report-player-avatar" class="report-player-avatar"></div>
            <div id="report-rank-badge" class="report-rank-badge">
                <span id="report-rank-icon" class="badge-icon-wrap"></span>
                <span id="report-rank-text">1st Place</span>
            </div>
            <h2 id="report-title" class="report-title">Trivia Champion!</h2>
            
            <div class="report-score-box">
                <span class="report-score-label">Final Score</span>
                <span id="report-score-val" class="report-score-val">0 pts</span>
            </div>

            <div class="report-stats-grid">
                <div class="report-stat-item">
                    <span class="stat-num" id="report-accuracy-val">0%</span>
                    <span class="stat-label">Accuracy</span>
                </div>
                <div class="report-stat-item">
                    <span class="stat-num" id="report-correct-val">0 / 0</span>
                    <span class="stat-label">Correct</span>
                </div>
                <div class="report-stat-item">
                    <span class="stat-num stat-streak-wrap" id="report-streak-val">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 2C10 6 7 9 7 13C7 16.5 9.5 19 12 19C14.5 19 17 16.5 17 13C17 10 15 7 12 2Z" fill="#F97316"/><path d="M12 9C10.5 11.5 9.5 13 9.5 15C9.5 16.5 10.5 18 12 18C13.5 18 14.5 16.5 14.5 15C14.5 13.5 13.5 12 12 9Z" fill="#FDE047"/></svg>
                        <span id="report-streak-num">0</span>
                    </span>
                    <span class="stat-label">Best Streak</span>
                </div>
            </div>

            <!-- Top 3 Podium Summary -->
            <div class="podium-summary-box">
                <h4 style="margin: 0 0 0.5rem 0; font-size: 0.9rem; text-transform: uppercase; color: #888;">Top Players</h4>
                <div id="podium-summary-list" class="podium-summary-list"></div>
            </div>

            <button id="play-again-btn" class="fat-btn" style="margin-top: 1.5rem; background: #26890c;">Play Again</button>
        </div>
    </div>

    <script src="/shared/soundManager.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="player.js"></script>
